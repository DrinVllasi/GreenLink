services:
  db:
    image: postgres:16
    container_name: greenlink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenlink
      POSTGRES_PASSWORD: greenlink
      POSTGRES_DB: greenlink
    ports:
      - "5432:5432"
    volumes:
      - greenlink_pgdata:/var/lib/postgresql/data

volumes:
  greenlink_pgdata:
